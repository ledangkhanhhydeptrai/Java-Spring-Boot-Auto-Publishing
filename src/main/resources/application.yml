server:
  port: ${PORT:8080}

spring:
  application:
    name: socialhub

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/socialhub}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5673}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        auto-startup: ${RABBITMQ_LISTENER_ENABLED:false}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

app:
  google-sheets:
    writeback-worker-enabled: true
    writeback-delay-ms: 30000
    writeback-initial-delay-ms: 10000
  # =========================
  # AUTHENTICATION / JWT
  # =========================
  jwt-secret: ${JWT_SECRET}
  jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  account-vault:
    bulk-preparation-enabled: ${ACCOUNT_VAULT_BULK_PREPARATION_ENABLED:false}
    bulk-live-start-enabled: ${ACCOUNT_VAULT_BULK_LIVE_START_ENABLED:false}
  # =========================
  # CORS / COOKIES
  # =========================
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
  cookie-secure: ${COOKIE_SECURE:false}
  cookie-same-site: ${COOKIE_SAME_SITE:Lax}

  # =========================
  # PUBLISHER SCHEDULER
  # =========================
  publisher-enabled: ${PUBLISHER_ENABLED:false}
  publisher-poll-ms: ${PUBLISHER_POLL_MS:15000}
  publisher-batch-size: ${PUBLISHER_BATCH_SIZE:5}

  # =========================
  # AUTOMATION QUEUE — PHASE 2B
  # =========================
  automation:
    # LIVE execution is OFF by default. Enable only after end-to-end verification.
    live:
      enabled: ${AUTOMATION_LIVE_ENABLED:false}
      facebook-worker-enabled: ${AUTOMATION_FACEBOOK_WORKER_ENABLED:false}
      threads-worker-enabled: ${AUTOMATION_THREADS_WORKER_ENABLED:false}
    queue:
      enabled: ${AUTOMATION_QUEUE_ENABLED:false}
      dispatch-enabled: ${AUTOMATION_QUEUE_DISPATCH_ENABLED:false}
      live-dispatch-enabled: ${AUTOMATION_QUEUE_LIVE_DISPATCH_ENABLED:false}
      observe-enabled: ${AUTOMATION_QUEUE_OBSERVE_ENABLED:false}
      start-after: ${AUTOMATION_QUEUE_START_AFTER:}
      max-per-scan: ${AUTOMATION_QUEUE_MAX_PER_SCAN:25}
      poll-ms: ${AUTOMATION_QUEUE_POLL_MS:15000}

  # =========================
  # FACEBOOK GROUP WORKER
  # =========================
  group-worker-token: ${GROUP_WORKER_TOKEN:}

  # =========================
  # THREADS
  # =========================
  threads:
    publisher-enabled: ${THREADS_PUBLISHER_ENABLED:false}
    publisher-batch-size: ${THREADS_PUBLISHER_BATCH_SIZE:3}
    manual-publishing-enabled: ${THREADS_MANUAL_PUBLISHING_ENABLED:false}

    app-id: ${THREADS_APP_ID:}
    app-secret: ${THREADS_APP_SECRET:}
    redirect-uri: ${THREADS_REDIRECT_URI:}
    state-secret: ${THREADS_OAUTH_STATE_SECRET:}
    token-key: ${THREADS_TOKEN_ENCRYPTION_KEY:}

    frontend-return-url: ${THREADS_FRONTEND_RETURN_URL:http://localhost:5173/social-accounts}

  # =========================
  # META GRAPH API
  # =========================
  meta:
    graph-version: ${META_GRAPH_VERSION:v23.0}
    base-url: ${META_BASE_URL:http://127.0.0.1:9090}

  # =========================
  # FACEBOOK OAUTH / FANPAGE
  # =========================
  facebook:
    app-id: ${FACEBOOK_APP_ID:}
    app-secret: ${FACEBOOK_APP_SECRET:}
    redirect-uri: ${FACEBOOK_REDIRECT_URI:}
    state-secret: ${FACEBOOK_OAUTH_STATE_SECRET:}
    token-key: ${FACEBOOK_TOKEN_ENCRYPTION_KEY:}

    graph-version: ${META_GRAPH_VERSION:v23.0}
    frontend-return-url: ${FACEBOOK_FRONTEND_RETURN_URL:http://localhost:5173/social-accounts}

    # MOCK = mock server
    # LIVE = Facebook Graph API thật
    publishing-mode: ${FACEBOOK_PUBLISHING_MODE:MOCK}

    # Giữ cho chế độ kiểm thử LIVE một Job
    live-job-id: ${FACEBOOK_LIVE_JOB_ID:}

    # Tắt đăng hàng loạt mặc định
    bulk-enabled: ${FACEBOOK_BULK_ENABLED:false}
    multi-job-enabled: ${FACEBOOK_MULTI_JOB_ENABLED:false}

    # Video thông thường trên Facebook Page
    video-publishing-enabled: ${FACEBOOK_VIDEO_PUBLISHING_ENABLED:false}

    # Facebook Reels
    reels-publishing-enabled: ${FACEBOOK_REELS_PUBLISHING_ENABLED:false}

# =========================
# SPRING ACTUATOR
# =========================
management:
  endpoints:
    web:
      exposure:
        include: health,info

# =========================
# SWAGGER / OPENAPI
# =========================
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs

  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    csrf:
      enabled: true
      cookie-name: XSRF-TOKEN
      header-name: X-XSRF-TOKEN

# =========================
# LOGGING
# =========================
logging:
  file:
    name: logs/socialhub-mock.log
  level:
    org.springframework.security: DEBUG
    org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping: TRACE

# =========================
# MOCK QUEUE
# =========================
socialhub:
  mock-queue:
    terminal-enabled: ${SOCIALHUB_MOCK_TERMINAL_ENABLED:false}
    enabled: ${SOCIALHUB_MOCK_QUEUE_ENABLED:false}
    seed: ${SOCIALHUB_MOCK_QUEUE_SEED:false}
    run-confirm: ${SOCIALHUB_MOCK_RUN_CONFIRM:}
    accounts: ${SOCIALHUB_MOCK_ACCOUNTS:100}
    jobs-per-account: ${SOCIALHUB_MOCK_JOBS_PER_ACCOUNT:10}
    inject-duplicates: ${SOCIALHUB_MOCK_INJECT_DUPLICATES:10}
