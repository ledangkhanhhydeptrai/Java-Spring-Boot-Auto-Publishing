
# ==================================================
# SOCIALHUB TEST CONFIGURATION
# ==================================================

server:
  port: 0

spring:
  application:
    name: socialhub-test

  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5433/socialhub_test}
    username: ${TEST_DB_USERNAME:postgres}
    password: ${TEST_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: localhost
    port: 5673
    listener:
      simple:
        auto-startup: false

# Dành cho các Bean dùng @Value("${META_GRAPH_VERSION}")
META_GRAPH_VERSION: "v23.0"

cloudinary:
  cloud-name: "socialhub-test"
  api-key: "123456789012345"
  api-secret: "test-only-not-real"

app:
  jwt-secret: "socialhub-test-only-jwt-secret-with-more-than-32-bytes-2026"
  jwt-expiration-minutes: 1440

  cors-origin: "http://localhost:5173"
  cookie-secure: false
  cookie-same-site: Lax

  publisher-enabled: false
  publisher-poll-ms: 15000
  publisher-batch-size: 5

  automation:
    live:
      enabled: false
    queue:
      enabled: false
      observe-enabled: false
      start-after: ""
      max-per-scan: 5
      poll-ms: 15000

  group-worker-token: ""

  meta:
    graph-version: "v23.0"
    base-url: "http://127.0.0.1:9090"

  facebook:
    app-id: ""
    app-secret: ""
    redirect-uri: ""
    state-secret: ""
    token-key: ""
    graph-version: "v23.0"
    frontend-return-url: "http://localhost:5173/social-accounts"
    publishing-mode: MOCK
    live-job-id: ""
    bulk-enabled: false
    multi-job-enabled: false

  threads:
    app-id: ""
    app-secret: ""
    redirect-uri: ""
    state-secret: ""
    token-key: ""
    frontend-return-url: "http://localhost:5173/social-accounts"
    publisher-enabled: false
    publisher-batch-size: 3
    manual-publishing-enabled: false

socialhub:
  mock-queue:
    enabled: false
    seed: false
